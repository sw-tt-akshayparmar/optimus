<div class="chat-container flex h-full w-full bg-(--bg-root-900) border-l border-(--border-soft)">
  <aside
    class="side-pane w-72 h-full flex flex-col bg-(--bg-surface-1) border-r border-(--border-soft)"
  >
    <div class="px-4 py-4 border-b border-(--border-soft)">
      <h2 class="text-lg font-semibold text-(--text-primary)">Chats</h2>
    </div>
    <div class="flex flex-col gap-2 p-4">
      <button
        mat-flat-button
        color="primary"
        class="w-full justify-start"
        (click)="router.navigate(['new'], { relativeTo: route })"
      >
        <mat-icon class="mr-2">create</mat-icon>
        New Chat
      </button>
      <button
        mat-stroked-button
        class="w-full justify-start"
        (click)="router.navigate(['all'], { relativeTo: route })"
      >
        <mat-icon class="mr-2">mark_chat_unread</mat-icon>
        Requests
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-2 pb-4">
      @for (c of conversations(); track c.id) {
        <div
          class="group flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer transition-all duration-200 bg-(--bg-surface-2) hover:bg-(--bg-card-hover)"
          (click)="openConv(c)"
        >
          <img
            [alt]="c.title"
            [ngSrc]="'https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/discord-round-color-icon.png'"
            class="h-10 w-10 flex items-center justify-center rounded-full bg-(--bg-surface-3) text-sm font-semibold text-(--text-primary)"
            [height]="100"
            [width]="10"
          />
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-(--text-primary) truncate">
              {{ c.title }}
            </div>
            <div class="text-xs text-(--text-secondary) truncate">Last message preview...</div>
          </div>
          <div class="text-xs text-(--text-muted)">2h</div>
        </div>
      }
    </div>
  </aside>
  <main class="main-pane flex-1 h-full w-full bg-(--bg-surface-2)">
    <router-outlet />
  </main>
</div>
