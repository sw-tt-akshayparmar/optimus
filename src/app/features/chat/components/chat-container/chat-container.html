<div class="chat-container flex h-full w-full bg-(--bg-root-900) border-l border-(--border-soft)">
  <aside
    class="side-pane w-72 h-full flex flex-col bg-(--bg-surface-1) border-r border-(--border-soft)"
  >
    <div class="px-5 py-4 border-b border-(--border-soft)">
      <h2 class="text-lg text-(--text-primary-strong)">Chats</h2>
    </div>

    <div class="flex flex-col gap-3 p-4">
      <button
        mat-flat-button
        class="bg-(--neon-blue-500)! text-(--text-inverse)! w-full justify-start transition-all duration-200 hover:bg-(--neon-blue-700)! hover:shadow-(--glow-blue)"
        (click)="router.navigate(['new'], { relativeTo: route })"
      >
        <mat-icon class="mr-2 text-(--text-inverse)!"> create</mat-icon>
        New Chat
      </button>
      <button
        mat-stroked-button
        class="border-(--neon-purple-500)! text-(--neon-purple-500)! w-full justify-start transition-all duration-200 hover:bg-(--neon-purple-300)/15! hover:border-(--neon-purple-700)! hover:text-(--neon-purple-700)!"
        (click)="router.navigate(['all'], { relativeTo: route })"
      >
        <mat-icon class="mr-2 text-(--neon-purple-500)!"> mark_chat_unread</mat-icon>
        Requests
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-3 pb-4">
      @for (c of conversations(); track c.id) {
        <div
          class="chat-item group flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer bg-(--bg-surface-2) border border-transparent transition-all duration-200 hover:bg-(--bg-card-hover) hover:border-(--neon-blue-300)/40"
          (click)="openConv(c)"
          [ngClass]="{
            'bg-(--bg-surface-5)': selected?.id === c.id
          }"
        >
          <div
            class="h-10 w-10 rounded-full flex items-center justify-center bg-(--bg-surface-3) border border-(--border-soft)"
          >
            <img
              [alt]="c.title"
              [ngSrc]="'https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/discord-round-color-icon.png'"
              class="rounded-full"
              [width]="36"
              [height]="36"
            />
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm text-(--text-primary) truncate">
              {{ c.title }}
            </div>

            <div class="text-xs text-(--text-secondary) truncate">Last message preview...</div>
          </div>
          <div
            class="text-xs text-(--text-muted) group-hover:text-(--neon-blue-500) transition-colors duration-200"
          >
            2h
          </div>
        </div>
      }
    </div>
  </aside>
  <main class="main-pane flex-1 h-full w-full bg-(--bg-surface-2)">
    <router-outlet />
  </main>
</div>
