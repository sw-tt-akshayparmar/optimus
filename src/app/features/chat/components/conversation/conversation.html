<div class="flex flex-col h-full bg-(--bg-surface-2)">
  <div class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
    @for (message of messages(); track message.id) {
      <div
        class="flex flex-col max-w-[75%]"
        [ngClass]="{
          'ml-auto items-end': message.sender === userService.getUserData().id,
          'mr-auto items-start': message.sender !== userService.getUserData().id,
        }"
      >
        <div
          class="px-4 py-3 rounded-2xl text-sm shadow-sm wrap-break-word transition-all duration-150"
          [ngClass]="{
            'bg-(--bg-card-soft) text-(--text-primary) rounded-br-md':
              message.sender === userService.getUserData().id,
            'bg-(--bg-surface-3) text-(--text-primary) rounded-bl-md':
              message.sender !== userService.getUserData().id,
          }"
        >
          {{ message.content }}
        </div>
        <div class="mt-1 text-[11px] text-(--text-muted) flex gap-2">
          <span>{{ message.user?.name || message.sender }}</span>
          <span>•</span>
          <span>{{ getDateFormat(message.created_at) }}</span>
        </div>
      </div>
    }
  </div>

  <div class="border-t border-(--border-soft) bg-(--bg-surface-1) px-4 py-3">
    <div class="flex items-center gap-3">
      <input
        type="text"
        [formControl]="input"
        placeholder="Type a message..."
        class="flex-1 px-4 py-2 rounded-full bg-(--bg-surface-3) text-(--text-primary) text-sm outline-none focus:ring-2 focus:ring-(--neon-blue-700) transition-all duration-200"
        (keyup.enter)="sendMessage()"
      />
      <button
        class="px-4 py-2 rounded-full bg-(--neon-blue-500) text-(--text-inverse) text-sm hover:bg-(--neon-blue-700) transition-all duration-150"
      >
        Send
      </button>
    </div>
  </div>
</div>
