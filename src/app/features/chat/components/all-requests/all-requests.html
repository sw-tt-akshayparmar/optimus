<div class="flex flex-col gap-3 p-4">
  @for (request of requests(); track request.id) {
    @let isSent = request.sender === userService.getUserData().id;
    <div
      class="group relative flex items-center gap-4 px-4 py-3 rounded-2xl border border-(--grid-line) transition-all duration-200 hover:shadow-md hover:-translate-y-px"
    >
      <span
        class="absolute left-0 top-2 bottom-2 w-1 rounded-full"
        [class]="{
          'bg-(--color-info)': isSent,
          'bg-(--color-success)': !isSent,
        }"
      ></span>

      <div class="relative shrink-0">
        <img
          ngSrc="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/discord-round-color-icon.png"
          width="40"
          height="40"
          alt="Avatar"
          class="rounded-full ring-1 ring-(--grid-line)"
        />
      </div>

      <div class="flex flex-col flex-1 min-w-0">
        <span class="text-sm text-(--text-primary) truncate">
          {{ isSent ? request.receiver_user?.name : request.sender_user?.name }}
        </span>

        <span class="text-xs text-(--text-muted) truncate mt-0.5">
          &#64;{{ isSent ? request.receiver_user?.username : request.sender_user?.username }}
        </span>
      </div>

      <div class="w-fit h-fit flex items-center justify-between gap-2">
        @if (isSent) {
          <button
            mat-icon-button
            class="h-10 w-10 rounded-lg flex items-center justify-center transition-all duration-150 danger"
            (click)="cancelRequest(request)"
          >
            <mat-icon class="text-[14px]">close</mat-icon>
          </button>
        } @else {
          <button
            mat-icon-button
            class="h-10 w-10 rounded-lg flex items-center justify-center transition-all duration-150 text-success"
            (click)="acceptRequest(request)"
          >
            <mat-icon class="text-[14px]">check</mat-icon>
          </button>

          <button
            mat-icon-button
            class="h-10 w-10 rounded-lg flex items-center justify-center transition-all duration-150 text-danger"
            (click)="rejectRequest(request)"
          >
            <mat-icon class="text-[14px]">close</mat-icon>
          </button>
        }
      </div>
    </div>
  }
</div>
