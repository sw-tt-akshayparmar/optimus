<div class="flex flex-col gap-2 p-2">
  @for (request of requests(); track request.id) {
    @let isSent = request.sender === userService.getUserData().id;
    <div
      class="group relative flex items-center gap-3 px-4 py-2.5 rounded-xl transition-all duration-200"
      [class]="{
        'bg-(--color-info-soft)': isSent,
        'bg-(--color-success-soft)': !isSent,
      }"
    >
      <span
        class="absolute left-0 top-0 h-full w-1 rounded-l-xl"
        [class]="{
          'bg-(--color-info)': isSent,
          'bg-(--color-success)': !isSent,
        }"
      ></span>
      <img
        ngSrc="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/discord-round-color-icon.png"
        width="38"
        height="38"
        class="rounded-full shrink-0 ring-1 ring-(--grid-line)"
        alt="Avatar"
      />
      <div class="flex flex-col flex-1 min-w-0">
        <span class="text-sm font-medium truncate text-(--text-primary)">
          {{ isSent ? request.receiver_user?.name : request.sender_user?.name }}
        </span>
        <span class="text-xs text-(--text-muted) truncate">
          {{ isSent ? request.receiver_user?.username : request.sender_user?.username }}
        </span>
      </div>
      <div class="flex items-center gap-1 opacity-60 group-hover:opacity-100 transition">
        @if (isSent) {
          <button
            mat-icon-button
            class="h-7 w-7 rounded-md text-(--color-danger) hover:bg-(--color-danger-soft) hover:text-(--color-danger-hover) transition flex justify-center items-center"
            (click)="cancelRequest(request)"
          >
            <mat-icon class="text-[17px]">close</mat-icon>
          </button>
        } @else {
          <button
            mat-icon-button
            class="h-7 w-7 rounded-md text-(--color-success) hover:bg-(--color-success-soft) hover:text-(--color-success-hover) transition flex justify-center items-center"
            (click)="acceptRequest(request)"
          >
            <mat-icon class="text-[17px]">check</mat-icon>
          </button>
          <button
            mat-icon-button
            class="h-7 w-7 rounded-md text-(--color-danger) hover:bg-(--color-danger-soft) hover:text-(--color-danger-hover) transition flex justify-center items-center"
            (click)="rejectRequest(request)"
          >
            <mat-icon class="text-[17px]">close</mat-icon>
          </button>
        }
      </div>
    </div>
  }
</div>
