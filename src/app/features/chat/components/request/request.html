<div class="w-full flex flex-col items-center">
  <div class="mt-4">
    <form [formGroup]="form" class="">
      <mat-form-field appearance="outline" class="w-2xl">
        <mat-label>Search</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput formControlName="search" type="text" (input)="searchUsers($event)" />
      </mat-form-field>
    </form>

    <div class="mt-2">
      @for (record of records(); let idx = $index; track $index) {
        <div
          class="group flex items-center gap-4 mt-3 px-4 py-3 rounded-xl bg-(--bg-surface-1) border border-(--border-soft) shadow-(--shadow-sm) transition-all duration-200 hover:bg-(--bg-card-hover) hover:border-(--neon-blue-300)/40"
        >
          <div class="flex items-center justify-center rounded-lg bg-(--bg-surface-2) p-2">
            <img
              [ngSrc]="'https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/discord-round-color-icon.png'"
              alt="User Avatar"
              [width]="56"
              [height]="56"
              class="rounded-md"
            />
          </div>
          <div class="flex flex-col flex-1 min-w-0">
            <div class="text-base text-(--text-primary-strong) truncate">
              {{ record.user.name }}
            </div>
            <div class="text-sm text-(--text-muted) truncate">&#64;{{ record.user.username }}</div>
          </div>
          <div>
            @if (record.invited) {
              <button
                matButton="outlined"
                disabled
                class="border-(--neon-green-500)! text-(--neon-green-500)! bg-(--neon-green-300)/10!"
              >
                <mat-icon class="text-(--neon-green-500)!">check</mat-icon>
                Invited
              </button>
            } @else {
              <button
                matButton="outlined"
                (click)="inviteUser(record.user, idx)"
                class="border-(--neon-blue-500)! text-(--neon-blue-500)! transition-all duration-200 hover:bg-(--neon-blue-300)/15! hover:border-(--neon-blue-700)! hover:text-(--neon-blue-700)!"
              >
                <mat-icon class="text-(--neon-blue-500)!"> create</mat-icon>
                Invite
              </button>
            }
          </div>
        </div>
      }
    </div>
  </div>
</div>
