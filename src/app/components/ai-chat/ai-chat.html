<div
  class="gemini-chat-container p-4 rounded-xl bg-(--bg-surface-2) border border-white/5 shadow-lg flex flex-col h-[95%]"
>
  <div class="text-(--neon-purple) font-bold mb-4 border-b border-white/5 pb-2">AI Assistant</div>
  <div #chatContainer class="message-list grow overflow-y-auto mb-4 space-y-4">
    @for (message of messages(); track $index) {
      <div
        class="message"
        [class.user-message]="message.sender === 'user'"
        [class.ai-message]="message.sender === 'ai'"
      >
        <div
          class="message-content p-3 rounded-lg max-w-xs"
          [class.bg-blue-600]="message.sender === 'user'"
          [class.text-white]="message.sender === 'user'"
          [class.self-end]="message.sender === 'user'"
          [class.bg-gray-700]="message.sender === 'ai'"
          [class.text-gray-300]="message.sender === 'ai'"
          [class.self-start]="message.sender === 'ai'"
        >
          {{ message.text }}
        </div>
      </div>
    }
  </div>
  <form class="message-form" [formGroup]="chatForm" (ngSubmit)="sendMessage()">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Type your message...</mat-label>
      <input matInput formControlName="message" (keyup.enter)="sendMessage()" />
      <button mat-icon-button matSuffix (click)="sendMessage()">
        <mat-icon>send</mat-icon>
      </button>
    </mat-form-field>
  </form>
</div>
