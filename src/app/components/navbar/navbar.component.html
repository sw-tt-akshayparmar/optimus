<nav class="w-full flex items-center justify-between px-6 py-1 bg-(--bg-surface-1)">
  <div class="logo">
    <a routerLink="/" class="text-xl text-(--neon-green-300)"> OPTIMUS </a>
  </div>

  <ul class="flex items-center gap-6 list-none m-0 p-0">
    @for (link of navLinks; track link) {
      <li>
        <a
          [routerLink]="link.to"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.to === '/' }"
          class="relative px-3 py-2 rounded-lg text-(--text-secondary) font-medium hover:text-white"
        >
          {{ link.label }}
        </a>
      </li>
    }
  </ul>

  @if (userService.isLoggedIn()) {
    <div class="flex items-center gap-5">
      <div class="p-1 rounded-lg">
        <img
          [ngSrc]="'https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/discord-round-color-icon.png'"
          alt="User Avatar"
          [width]="40"
          [height]="40"
          class="rounded-md"
        />
      </div>

      <button
        matButton="outlined"
        class="border-(--neon-red-500)! text-(--neon-red-500)!"
        (click)="logout()"
      >
        <mat-icon> exit_to_app</mat-icon>
        LOG OUT
      </button>
    </div>
  } @else {
    <div class="flex items-center gap-4">
      <button
        mat-flat-button
        class="bg-(--neon-blue-500)! text-(--text-inverse)!"
        (click)="login()"
      >
        <mat-icon class="text-(--text-inverse)!"> login</mat-icon>
        LOG IN
      </button>

      <button
        mat-stroked-button
        class="border-(--neon-purple-500)! text-(--neon-purple-500)!"
        (click)="register()"
      >
        <mat-icon class="text-(--neon-purple-500)!"> person_add</mat-icon>
        SIGN UP
      </button>
    </div>
  }
</nav>
