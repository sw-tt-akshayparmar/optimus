<nav class="w-full flex items-center justify-between">
  <!-- Logo -->
  <div class="logo">
    <a routerLink="/">OPTIMUS</a>
  </div>

  <!-- Navigation Links -->
  <ul class="flex items-center gap-2 list-none m-0 p-0">
    @for (link of navLinks; track link) {
      <li>
        <a
          [routerLink]="link.to"
          class="nav-link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.to === '/' }"
        >
          {{ link.label }}
        </a>
      </li>
    }
  </ul>

  <!-- Action Buttons -->
  <div class="flex items-center gap-3">
    <button mat-flat-button class="login-btn" (click)="router.navigate(['login'])">
      <mat-icon>login</mat-icon>
      LOG IN
    </button>
    <button mat-stroked-button class="signup-btn" (click)="router.navigate(['register'])">
      <mat-icon>person_add</mat-icon>
      SIGN UP
    </button>
  </div>
</nav>
