<div class="chessboard">
  <table class="grid" id="chessgrid" cdkDropListGroup>
    <thead>
      @if (loader.isLoading(LoaderActions.GAME_REQUEST)) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      }
    </thead>
    <tbody [ngClass]="{ 'blur-sm': loader.isLoading(LoaderActions.GAME_REQUEST) }">
      @for (rank of board(); let i = $index; track i) {
        <tr class="rank">
          @for (tile of rank; let j = $index; track j) {
            <td
              class="tile"
              [id]="'tile-' + i + '-' + j"
              [ngClass]="{
                dark: (i + j) % 2 === 1,
                light: (i + j) % 2 === 0,
              }"
              cdkDropList
              (cdkDropListDropped)="drop($event)"
              [cdkDropListData]="{ x: i, y: j }"
            >
              <!--            [cdkDropListEnterPredicate]="check"-->
              <!--          >-->
              @if (board()[i][j]) {
                <div
                  class="piece flex justify-center items-center"
                  cdkDrag
                  [cdkDragData]="{ x: i, y: j }"
                  (cdkDragStarted)="onPieceGrab($event)"
                >
                  <!--                  <div class="w-4 h-4 rounded-full bg-[#0ff5]"></div>-->
                  <img
                    ngSrc="{{
                      chessData.PIECE_IMG[board()[i][j]!.color ? 1 : 0][board()[i][j]!.piece]
                    }}"
                    alt="{{
                      chessData.PIECE_IMG[board()[i][j]!.color ? 1 : 0][board()[i][j]!.piece]
                    }}"
                    [width]="config.BOARD.TILE_PX"
                    [height]="config.BOARD.TILE_PX"
                  />
                </div>
                @if (turn() === playAs && moveMap()?.[i]?.[j]) {
                  <div class="mark-piece"></div>
                }
              } @else {
                @if (turn() === playAs && moveMap()?.[i]?.[j]) {
                  <div class="mark"></div>
                }
                <!--              <div class="border border-red-200 w-full h-[50px] absolute" *cdkDragPlaceholder></div>-->
              }
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
  <button matFab extended class="mt-2" (click)="startGame()">🚀</button>
</div>
